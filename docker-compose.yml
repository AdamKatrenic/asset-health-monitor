services:
  postgres:
    image: postgres:16
    container_name: ahm-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: asset_health
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ahm-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: ahm-app
    ports:
      - "3000:3000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=admin
      - PGPASSWORD=password123
      - PGDATABASE=asset_health
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: