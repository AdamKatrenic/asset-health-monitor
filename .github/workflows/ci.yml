name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: asset_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Inštalácia závislostí
        run: npm ci

      - name: Spustenie testov
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: admin
          PGPASSWORD: password123
          PGDATABASE: asset_health
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Build Docker image
        run: docker build -t asset-health-monitor .